name: Release companion

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
            executable: media-finder-companion.exe
            installer: windows
          - runner: windows-latest
            runtime: win-arm64
            executable: media-finder-companion.exe
            installer: windows
          - runner: macos-latest
            runtime: osx-x64
            executable: media-finder-companion
            installer: unix
          - runner: macos-latest
            runtime: osx-arm64
            executable: media-finder-companion
            installer: unix
          - runner: ubuntu-latest
            runtime: linux-x64
            executable: media-finder-companion
            installer: unix
          - runner: ubuntu-24.04-arm
            runtime: linux-arm64
            executable: media-finder-companion
            installer: unix
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained host
        shell: pwsh
        run: |
          dotnet publish companion/MediaFinder.Companion/MediaFinder.Companion.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o companion-package
      - name: Read package version
        id: package_version
        shell: pwsh
        run: |
          $version = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Assemble package
        shell: pwsh
        run: |
          $package = "media-finder-companion-${{ matrix.runtime }}"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "companion-package/${{ matrix.executable }}" $package
          if ("${{ matrix.installer }}" -eq "windows") {
            Copy-Item companion/installer/install-windows.cmd $package
            Copy-Item companion/installer/install-windows.ps1 $package
            Copy-Item companion/installer/uninstall-windows.ps1 $package
          } else {
            Copy-Item companion/installer/install-unix.sh $package
            Copy-Item companion/installer/uninstall-unix.sh $package
          }
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip"
      - name: Install Inno Setup
        if: matrix.installer == 'windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows setup executable
        if: matrix.installer == 'windows'
        shell: pwsh
        run: |
          $compiler = (Get-Command iscc.exe).Source
          $packageRoot = (Resolve-Path "media-finder-companion-${{ matrix.runtime }}").Path
          $outputDirectory = (Resolve-Path .).Path
          & $compiler `
            "/DPackageRoot=$packageRoot" `
            "/DRuntime=${{ matrix.runtime }}" `
            "/DAppVersion=${{ steps.package_version.outputs.version }}" `
            "/DOutputDirectory=$outputDirectory" `
            companion/installer/windows/MediaFinder.iss
      - name: Build macOS package
        if: matrix.installer == 'unix' && startsWith(matrix.runtime, 'osx-')
        shell: bash
        run: |
          chmod +x companion/scripts/package-macos-native.sh companion/installer/*.sh companion/installer/macos/*
          companion/scripts/package-macos-native.sh \
            "${{ matrix.runtime }}" \
            "companion-package/${{ matrix.executable }}" \
            "$GITHUB_WORKSPACE" \
            "${{ steps.package_version.outputs.version }}"
      - name: Install Linux package tools
        if: matrix.installer == 'unix' && startsWith(matrix.runtime, 'linux-')
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - name: Build Linux packages
        if: matrix.installer == 'unix' && startsWith(matrix.runtime, 'linux-')
        shell: bash
        run: |
          chmod +x companion/scripts/package-linux-native.sh companion/installer/*.sh companion/installer/linux/*
          companion/scripts/package-linux-native.sh \
            "${{ matrix.runtime }}" \
            "companion-package/${{ matrix.executable }}" \
            "$GITHUB_WORKSPACE" \
            "${{ steps.package_version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: media-finder-companion-${{ matrix.runtime }}
          path: |
            media-finder-companion-${{ matrix.runtime }}.zip
            media-finder-companion-${{ matrix.runtime }}-setup.exe
            media-finder-companion-${{ matrix.runtime }}.pkg
            media-finder-companion-${{ matrix.runtime }}.deb
            media-finder-companion-${{ matrix.runtime }}.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          sha256sum media-finder-companion-* > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" media-finder-companion-* SHA256SUMS.txt --generate-notes
